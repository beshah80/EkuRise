<div class="page-bg">
  <div class="form-card">
    <div class="form-header">
      <div class="logo-mark">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
          <circle cx="18" cy="18" r="18" fill="#0F6B2D"/>
          <path d="M10 18a8 8 0 1 1 16 0" stroke="#F2B705" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="18" cy="18" r="3" fill="#F2B705"/>
          <path d="M18 10v2M18 24v2M10 18H8M28 18h-2" stroke="#F2B705" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="logo-text">EnkuRise</span>
      <h2>Welcome Back</h2>
      <p>Sign in to your savings circle</p>
    </div>

    @if (error()) {
      <div class="banner" [class.error]="!otpSent()" [class.info]="otpSent()">
        @if (otpSent()) {
          <span class="otp-label">Your OTP Code</span>
        }
        {{ error() }}
      </div>
    }

    <form [formGroup]="form" class="auth-form">
      <div class="field">
        <label>Phone Number</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.4 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.8a16 16 0 0 0 6.29 6.29l.95-.95a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </span>
          <input
            type="tel"
            formControlName="phoneNumber"
            placeholder="09xxxxxxxx"
            [class.invalid]="form.controls.phoneNumber.touched && form.controls.phoneNumber.invalid"
          />
        </div>
        @if (form.controls.phoneNumber.touched && form.controls.phoneNumber.invalid) {
          <small class="error-text">Enter a valid phone number</small>
        }
      </div>

      @if (showPin()) {
        <div class="field">
          <label>PIN</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input
              type="password"
              formControlName="pin"
              placeholder="Enter your PIN"
              maxlength="6"
            />
          </div>
        </div>
        <button type="button" class="btn-primary"
          (click)="submitPin()"
          [disabled]="loading() || form.controls.phoneNumber.invalid || !form.value.pin">
          @if (loading()) {
            <span class="spinner"></span> Signing in...
          } @else {
            Login with PIN
          }
        </button>
        <div class="divider"><span>or</span></div>
        <button type="button" class="btn-outline" (click)="togglePin()">
          Send OTP Code Instead
        </button>
      } @else {
        <button type="button" class="btn-primary"
          (click)="submitOtp()"
          [disabled]="loading() || form.controls.phoneNumber.invalid">
          @if (loading()) {
            <span class="spinner"></span> Sending...
          } @else {
            Send Login Code
          }
        </button>
        <div class="divider"><span>or</span></div>
        <button type="button" class="btn-outline" (click)="togglePin()">
          Login with PIN
        </button>
      }
    </form>

    <p class="auth-footer">
      Don't have an account? <a routerLink="/register">Register</a>
    </p>
  </div>
</div>
