<div class="page">
  <header class="top-bar">
    <button class="back-btn" (click)="cancel()">← Back</button>
    <h1>Create Circle</h1>
  </header>

  <div class="content">
    @if (error()) {
      <div class="banner error">{{ error() }}</div>
    }

    <div class="card">
      <form [formGroup]="form" (ngSubmit)="submit()" class="form">
        <div class="field">
          <label>Circle Name</label>
          <input type="text" formControlName="name" placeholder="e.g. Office Ekub 2026" />
          @if (form.controls.name.touched && form.controls.name.invalid) {
            <small class="error-text">Name must be at least 3 characters</small>
          }
        </div>

        <div class="field">
          <label>Contribution per Round (ETB)</label>
          <input type="number" formControlName="contribution" placeholder="e.g. 500" min="1" />
          @if (form.controls.contribution.touched && form.controls.contribution.invalid) {
            <small class="error-text">Enter a valid amount (minimum 1 ETB)</small>
          }
        </div>

        <div class="field">
          <label>Meeting Label</label>
          <select formControlName="meetingLabel">
            <option value="Daily">Daily</option>
            <option value="Weekly">Weekly</option>
            <option value="Monthly">Monthly</option>
          </select>
        </div>

        <button type="submit" class="btn-primary" [disabled]="form.invalid || loading()">
          {{ loading() ? 'Creating...' : 'Create Circle' }}
        </button>
        <button type="button" class="btn-ghost" (click)="cancel()">Cancel</button>
      </form>
    </div>
  </div>
</div>
