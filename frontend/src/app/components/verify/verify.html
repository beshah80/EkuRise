<div class="page-bg">
  <div class="form-card">
    <div class="icon-wrap">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0F6B2D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.4 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.8a16 16 0 0 0 6.29 6.29l.95-.95a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
    </div>

    <h1>Verify Your Phone</h1>
    <p>
      We sent a 6-digit code to<br/>
      <span class="phone-display">{{ phoneNumber }}</span>
    </p>

    @if (demoCode) {
      <div class="demo-hint">
        <span class="demo-label">Demo Code</span>
        <span class="demo-code">{{ demoCode }}</span>
      </div>
    }

    @if (error()) {
      <div class="banner error">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="verify()" class="otp-form">
      <input
        type="text"
        formControlName="code"
        maxlength="6"
        placeholder="000000"
        class="otp-input"
        inputmode="numeric"
        autocomplete="one-time-code"
      />
      @if (form.controls.code.touched && form.controls.code.invalid) {
        <small class="error-text">Enter the 6-digit code</small>
      }
      <button type="submit" class="btn-primary" [disabled]="loading() || form.invalid">
        @if (loading()) {
          <span class="spinner"></span> Verifying...
        } @else {
          Verify Phone
        }
      </button>
    </form>

    <p class="back-link"><a routerLink="/login">← Back to login</a></p>
  </div>
</div>
